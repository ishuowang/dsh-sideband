<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Sideband asynchronous context relay</title>
  <desc id="desc">A source Session invokes a native command that snapshots history. A detached tool-free summarizer creates a provenance capsule and delivers it quietly or with wakeup to another Session or an authorized Agent Team Room.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090b19"/><stop offset="0.55" stop-color="#11142b"/><stop offset="1" stop-color="#091e28"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#5a45df"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52e0bd"/><stop offset="1" stop-color="#18a58a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50b8ff"/><stop offset="1" stop-color="#277bd8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.36"/></filter>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b7cf6"/></marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52e0bd"/></marker>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/></pattern>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="758" rx="27" fill="url(#grid)" stroke="#9b93ff" stroke-opacity="0.2"/>
  <text x="72" y="74" fill="#f7f7ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700">Context moves. The active conversation does not.</text>
  <text x="72" y="110" fill="#a8acc9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17">Native command boundary · immutable snapshot · isolated summary · asynchronous delivery</text>
  <g filter="url(#shadow)"><rect x="70" y="162" width="360" height="422" rx="22" fill="#15182f" stroke="#7c70e6" stroke-opacity="0.48"/></g>
  <circle cx="105" cy="201" r="8" fill="#8b7cf6"/><text x="126" y="208" fill="#f4f2ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">Source Session</text><text x="98" y="244" fill="#9da2c5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14">still running</text>
  <rect x="98" y="276" width="304" height="78" rx="14" fill="#0d1023" stroke="#343963"/><text x="120" y="306" fill="#d7daf1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">/sideband send session:…</text><text x="120" y="333" fill="#8f94b7" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">native command — not a model message</text>
  <rect x="98" y="382" width="304" height="86" rx="14" fill="#1d1b3b" stroke="#766be1"/><text x="120" y="414" fill="#c9c4ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">1 · snapshot now</text><text x="120" y="440" fill="#aeb2cf" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">last 12 · last N · all · focus</text>
  <path d="M 122 508 C 162 484,206 530,250 504 S 334 526,382 496" fill="none" stroke="#5e6389" stroke-width="3" stroke-linecap="round"/><circle cx="382" cy="496" r="5" fill="#52e0bd"/><text x="120" y="550" fill="#52e0bd" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">source turn continues →</text>
  <g filter="url(#shadow)"><rect x="520" y="162" width="400" height="422" rx="22" fill="#15182f" stroke="#56dcbf" stroke-opacity="0.5"/></g>
  <circle cx="555" cy="201" r="8" fill="#52e0bd"/><text x="576" y="208" fill="#f1fffb" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">Sideband worker</text><text x="548" y="244" fill="#9da2c5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14">detached from the source turn</text>
  <rect x="548" y="276" width="344" height="72" rx="14" fill="#102926" stroke="#2bb89b"/><text x="570" y="307" fill="#8df0d8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">2 · process-local queue</text><text x="570" y="331" fill="#aebec0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">job id returned immediately</text>
  <rect x="548" y="370" width="344" height="104" rx="14" fill="#0d1023" stroke="#343963"/><circle cx="575" cy="401" r="12" fill="url(#violet)"/><path d="M 570 401 L 574 405 L 581 397" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="407" fill="#d7daf1" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">3 · summarizer LLM</text><text x="570" y="438" fill="#9ea3c4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">independent · no tools · bounded</text><text x="570" y="458" fill="#9ea3c4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">transcript treated as untrusted data</text>
  <rect x="548" y="496" width="344" height="60" rx="14" fill="#15243a" stroke="#3b8fd3"/><text x="570" y="523" fill="#8dccff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">4 · provenance capsule</text><text x="570" y="545" fill="#9eaec4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12">source · boundary · scope · focus · job · mode</text>
  <g filter="url(#shadow)"><rect x="1010" y="162" width="360" height="422" rx="22" fill="#15182f" stroke="#4daff1" stroke-opacity="0.48"/></g>
  <circle cx="1045" cy="201" r="8" fill="#50b8ff"/><text x="1066" y="208" fill="#f1f9ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="700">Destination</text><text x="1038" y="244" fill="#9da2c5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14">resolved and authorized</text>
  <rect x="1038" y="276" width="304" height="96" rx="14" fill="#13253b" stroke="#3b8fd3"/><circle cx="1065" cy="309" r="12" fill="url(#blue)"/><path d="M 1059 309 h12 M 1065 303 v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="1090" y="314" fill="#bfe4ff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">Session</text><text x="1060" y="344" fill="#9eaec4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">quiet or wakeup delivery</text>
  <rect x="1038" y="396" width="304" height="96" rx="14" fill="#112a27" stroke="#2bb89b"/><circle cx="1065" cy="429" r="12" fill="url(#mint)"/><circle cx="1061" cy="428" r="3" fill="#fff"/><circle cx="1069" cy="428" r="3" fill="#fff"/><path d="M 1058 437 Q 1065 442 1072 437" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="1090" y="434" fill="#baf7e8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">Agent Team Room</text><text x="1060" y="464" fill="#9ebdb7" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="13">optional · authorization preserved</text>
  <rect x="1038" y="516" width="304" height="40" rx="12" fill="#0d1023" stroke="#343963"/><text x="1190" y="541" text-anchor="middle" fill="#aeb2cf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">delivered · failed · cancelled</text>
  <path d="M 430 423 C 462 423,480 423,515 423" fill="none" stroke="#8b7cf6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)"/><text x="474" y="403" text-anchor="middle" fill="#a9a1fa" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12">frozen</text>
  <path d="M 920 423 C 952 423,974 423,1005 423" fill="none" stroke="#52e0bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrowMint)"/><text x="964" y="403" text-anchor="middle" fill="#7de8d0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12">async</text>
  <line x1="70" y1="632" x2="1370" y2="632" stroke="#fff" stroke-opacity="0.1"/>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14"><rect x="70" y="668" width="10" height="10" rx="3" fill="#8b7cf6"/><text x="94" y="678" fill="#b9bdd5">command never enters source model</text><rect x="398" y="668" width="10" height="10" rx="3" fill="#52e0bd"/><text x="422" y="678" fill="#b9bdd5">background lifetime is independent</text><rect x="753" y="668" width="10" height="10" rx="3" fill="#50b8ff"/><text x="777" y="678" fill="#b9bdd5">no in-flight target injection</text><rect x="1077" y="668" width="10" height="10" rx="3" fill="#f0b95b"/><text x="1101" y="678" fill="#b9bdd5">provenance on every relay</text></g>
  <text x="1370" y="724" text-anchor="end" fill="#676c91" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">Sideband · DSH 0.1.0-rc.6</text>
</svg>
